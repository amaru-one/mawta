[project]
name = "mawta"
version = "0.1.0"
description = "Mawta: a gradebook for Peruvian schools where AI drafts and the teacher decides. One service per school: API, worker, agents and the director chat."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "alembic-utils>=0.8.8",
    "bcrypt>=4.2.0",
    "httpx>=0.28.1",
    "langfuse>=4.14,<5",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-postgres>=3.2.0",
    "openai>=3.40.0",
    "psycopg[binary,pool]>=3.3.8",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.1.8",
    "sse-starlette>=3.5.0",
    "starlette>=0.50.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
mawta = "main:run"
useradd = "cli.useradd:main"
onboard = "cli.onboard:main"
chat-eval = "cli.chat_eval:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The app's modules live directly under src/ (no package wrapper), next to the mawta_schema
# package: ship everything there at the wheel root.
only-include = ["src"]
sources = ["src"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-alembic>=0.13.2",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
# Top-level modules live under src/, so they are first-party code for the import sorter.
src = [".", "src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Long lines are SQL comments copied from the database and Spanish prompt/message text; the
# formatter handles code.
ignore = ["E501"]

[tool.pyright]
include = ["src", "tests", "migrations"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# langsmith (a LangGraph dependency) loads a pytest plugin that uses a deprecated asyncio API.
filterwarnings = ["ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:langsmith"]
