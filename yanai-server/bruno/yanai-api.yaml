openapi: 3.0.3
info:
  title: Yanai API
  version: "1.0"
  description: |
    Dev-header, multi-tenant API for the six Yanai screens (Home, Class
    dashboard, Lesson/attendance, Student grades, Notifications, Profile).

    Import: Bruno -> Import Collection -> OpenAPI Spec -> select this file.
    Bruno groups operations by tag into folders (00 Health & Me .. 06
    Perfil) and pre-fills every header/path/query/body example shown below.

    Run: `go run ./cmd/api` from yanai-server/ against the seeded Postgres
    from docs/postgres-setup.md.

    Auth: every /api/v1/* operation requires X-Tenant-ID and X-Actor-ID
    (both pre-filled below with the seeded demo tenant and Janice Quispe's
    actor id). /healthz takes neither and lives outside /api/v1.

    Jobs: writes that enqueue a background job (scores -> grade.recompute)
    land within ~2s when WORKER_ENABLED=true.

    Correcting a score twice in a row 409s the second time -- the example
    scoreId below points at a specific live row that the first call
    supersedes. Re-fetch "Student grades" and swap in the new live score id
    to correct again.

    All example ids come from the live seed and regenerate on reseed.
    Refresh any of them with, e.g.:
      docker exec yanai-pg psql -U postgres -d yanai -Atc "set role yanai_app; \
        set app.tenant_id='11111111-1111-4111-8111-111111111111'; \
        select id from users where email='janice.quispe@cristorey.edu.pe';"

servers:
  - url: http://localhost:8080/api/v1
    description: Local dev

tags:
  - name: 00 Health & Me
  - name: 01 Inicio
  - name: 02 Clase panel
  - name: 03 Leccion
  - name: 04 Notas
  - name: 05 Competencias
    description: >
      Niveles de logro por competencia y conclusiones descriptivas — el registro
      oficial que exige la RVM 094-2020 (modificada por RVM 048-2024). A
      diferencia de "04 Notas", que recoge evidencia (y el sistema interno
      ponderado del colegio), esto es lo que asigna el docente y lo único que la
      norma reconoce.
  - name: 06 Criterios
    description: >
      Los criterios de evaluación que el docente escribe para cada competencia,
      y el nivel de cada estudiante frente a cada criterio en el periodo. Son la
      referencia contra la cual se valora la evidencia (RVM 094-2020); son
      evidencia para el juicio docente, nunca se promedian ni se agregan al
      nivel de logro.
  - name: 07 Notificaciones
  - name: 08 Perfil

components:
  parameters:
    TenantIdHeader:
      name: X-Tenant-ID
      in: header
      required: true
      schema: { type: string, format: uuid }
      example: "11111111-1111-4111-8111-111111111111"
    ActorIdHeader:
      name: X-Actor-ID
      in: header
      required: true
      schema: { type: string, format: uuid }
      example: "fceaeebc-f52e-4084-b25f-33aa982de744"
    ClassId:
      name: classID
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: "0eb5e1ff-cfec-446a-b629-35c108bbc9db"
      description: Inglés 5to B
    SessionId:
      name: sessionID
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: "97450626-84bd-4ed9-918d-5785ecf7b63e"
      description: The 8-Aug session
    StudentId:
      name: studentID
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: "1919d3e8-a34c-4f8c-8aaf-65b1de242534"
      description: Agustín Soto
    AssessmentId:
      name: assessmentID
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: "b4aa1a8a-39e4-4454-ba6f-e7e61b6bdaae"
      description: Quiz 1
    ScoreId:
      name: scoreID
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: "a42a4834-892b-4b42-8a5e-7e4e7c99fbb6"
      description: Agustín's live Participación score
    VoiceNoteId:
      name: voiceNoteID
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: "222123a0-8a93-43d8-9ca9-8dccb94eb94b"
      description: Saved, transcribed seed voice note
    NotificationId:
      name: notificationID
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: "78873111-9c33-4e3d-bc91-fe1fcdc0423a"
      description: level_drop alert
    DateQuery:
      name: date
      in: query
      required: false
      schema: { type: string, format: date }
      example: "2026-08-08"
      description: Defaults to today in the tenant timezone
    TermIdQuery:
      name: term_id
      in: query
      required: false
      schema: { type: string, format: uuid }
      example: "ff300a2c-7439-4186-9ff9-0fa54189358a"
      description: Defaults to the tenant's single active term (Bimestre III)
    QQuery:
      name: q
      in: query
      required: false
      schema: { type: string }
      description: Substring match against name (students) or class name

paths:
  /healthz:
    servers:
      - url: http://localhost:8080
        description: Root, no /api/v1 prefix, no auth
    get:
      tags: [00 Health & Me]
      summary: Healthz
      responses:
        "200": { description: OK }

  /me:
    get:
      tags: [00 Health & Me]
      summary: Me
      description: >
        Teacher + tenant identity for the topbar, plus
        `tenant.uses_internal_grading`: whether the school runs its own weighted
        numeric system alongside the official record (D.S. 009-2006-ED art.
        37.4.f). False hides every mark input and the computed grade; niveles de
        logro are unaffected, since the official record never comes from a
        number either way.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/ActorIdHeader"
      responses:
        "200": { description: OK }

  /home:
    get:
      tags: [01 Inicio]
      summary: Home
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/ActorIdHeader"
        - $ref: "#/components/parameters/DateQuery"
      responses:
        "200": { description: OK }

  /classes/{classID}/dashboard:
    get:
      tags: [02 Clase panel]
      summary: Class dashboard
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/ActorIdHeader"
        - $ref: "#/components/parameters/ClassId"
        - $ref: "#/components/parameters/TermIdQuery"
        - $ref: "#/components/parameters/DateQuery"
      responses:
        "200": { description: OK }

  /classes/{classID}/students/{studentID}/grades:
    get:
      tags: [04 Notas]
      summary: Student grades
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/ActorIdHeader"
        - $ref: "#/components/parameters/ClassId"
        - $ref: "#/components/parameters/StudentId"
        - $ref: "#/components/parameters/TermIdQuery"
      responses:
        "200": { description: OK }

  /classes/{classID}/students/{studentID}/competencies:
    get:
      tags: [05 Competencias]
      summary: Niveles de logro por competencia
      description: >
        El registro oficial (RVM 094-2020, modificada por RVM 048-2024): el nivel
        de logro AD/A/B/C que el docente asignó a cada competencia del área en el
        periodo, y si la conclusión descriptiva es obligatoria. No hay nivel
        sugerido: el nivel es juicio del docente sobre las evidencias, no un
        número que el sistema proponga primero. `level: null` significa que la
        competencia no se desarrolló en el periodo — no equivale a C.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/ActorIdHeader"
        - $ref: "#/components/parameters/ClassId"
        - $ref: "#/components/parameters/StudentId"
        - $ref: "#/components/parameters/TermIdQuery"
      responses:
        "200": { description: OK }

  /classes/{classID}/students/{studentID}/competency-levels:
    post:
      tags: [05 Competencias]
      summary: Asertar nivel de logro
      description: >
        Único escritor del nivel de logro oficial. Es juicio del docente sobre las
        evidencias del periodo (5.1.1.3 p.2-3), nunca se deriva de la nota
        calculada ni de los niveles por criterio. Append-only: volver a asertar
        supersede la fila anterior.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/ActorIdHeader"
        - $ref: "#/components/parameters/ClassId"
        - $ref: "#/components/parameters/StudentId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
            example:
              competency_id: "00000000-0000-0000-0000-000000000000"
              level: "B"
              note: null
      responses:
        "201": { description: Created }
        "400": { description: level must be AD, A, B or C }

  /classes/{classID}/students/{studentID}/conclusions:
    post:
      tags: [05 Competencias]
      summary: Conclusión descriptiva
      description: >
        Obligatoria cuando el nivel es C (5.1.1.3 p.7.d), cuando hay C en dos o
        más periodos consecutivos (p.3, y debe sustentar la falta de avance), y
        en cada periodo para estudiantes que enfrentan barreras educativas (p.7).
        El motivo lo determina el servidor, no el cliente. Una conclusión `final`
        sin `includes_recommendations` se rechaza con 422.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/ActorIdHeader"
        - $ref: "#/components/parameters/ClassId"
        - $ref: "#/components/parameters/StudentId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
            example:
              competency_id: "00000000-0000-0000-0000-000000000000"
              body: "Avances, dificultades y recomendaciones personalizadas."
              includes_recommendations: true
              status: "final"
      responses:
        "201": { description: Created }
        "422": { description: missing_recommendations }

  /classes/{classID}/criteria:
    get:
      tags: [06 Criterios]
      summary: Criterios de evaluación de la clase
      description: >
        Cada competencia del área con los criterios de evaluación que el docente
        escribió para ella. Con `student_id`, cada criterio trae además su fila
        de la grilla evidencia × criterio (`evidence`: una celda por evidencia
        valorada, de la más antigua a la más reciente) y `period_level`, el
        juicio de periodo heredado que ya no se escribe. Una competencia sin
        criterios se
        devuelve con la lista vacía, no se omite: bajo la RVM 094-2020 los
        criterios son la referencia contra la cual se valora la evidencia, así
        que una competencia sin ellos es justo lo que el docente necesita ver.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/ActorIdHeader"
        - $ref: "#/components/parameters/ClassId"
        - name: student_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/TermIdQuery"
      responses:
        "200": { description: OK }

  /classes/{classID}/competencies/{competencyID}/criteria:
    post:
      tags: [06 Criterios]
      summary: Crear criterio de evaluación
      description: >
        El docente escribe su propio criterio, opcionalmente anclado a un
        desempeño del CNEB (`performance_standard_id`). Se rechaza una
        descripción vacía y una competencia que no pertenezca al área de la clase.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/ActorIdHeader"
        - $ref: "#/components/parameters/ClassId"
        - name: competencyID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
            example:
              description: "Traduce un problema verbal con dos incógnitas a un sistema de ecuaciones."
              code: "CRIT1"
              performance_standard_id: null
      responses:
        "201": { description: Created }
        "400": { description: missing_description | competency_not_in_class }

  /criteria/{criterionID}/delete:
    post:
      tags: [06 Criterios]
      summary: Eliminar criterio (soft)
      description: >
        Borrado lógico. Los niveles ya registrados contra el criterio se
        conservan: son parte del historial académico del estudiante aunque el
        docente deje de usar el criterio.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/ActorIdHeader"
        - name: criterionID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: No Content }
        "404": { description: not_found }

  /classes/{classID}/students/{studentID}/criterion-levels:
    post:
      tags: [06 Criterios]
      summary: Asertar nivel por criterio, en una evidencia
      description: >
        Una celda de la grilla evidencia × criterio: el nivel AD/A/B/C que el
        estudiante mostró en un criterio, **en una evidencia concreta**.
        `assessment_id` es obligatorio — la RVM 094-2020 (5.1.1.3 p.3) valora la
        evidencia *a través* del criterio, así que el criterio es la regla y
        nunca lo calificado. No lleva `term_id`: el periodo lo aporta la
        evidencia. Es evidencia para el juicio del docente, no el registro
        oficial: nada lo promedia ni lo agrega al nivel de logro de la
        competencia. Append-only.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/ActorIdHeader"
        - $ref: "#/components/parameters/ClassId"
        - $ref: "#/components/parameters/StudentId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
            example:
              criterion_id: "00000000-0000-0000-0000-000000000000"
              assessment_id: "00000000-0000-0000-0000-000000000000"
              level: "A"
              note: null
      responses:
        "201": { description: Created }
        "400":
          description: >
            criterion_level_needs_evidence (falta `assessment_id`) |
            criterion_not_in_evidence (la evidencia no declara ese criterio) |
            evidence_not_for_student (evidencia personal de otro alumno) |
            level must be AD, A, B or C

  /assessments/{assessmentID}/criteria-grid:
    get:
      tags: [06 Criterios]
      summary: Grilla evidencia × criterio de una evidencia
      description: >
        Una evidencia sobre toda su nómina: los criterios que declara como
        columnas, los estudiantes como filas y los niveles ya registrados como
        celdas. Es la vista de corrección — un criterio a la vez sobre treinta
        trabajos, en lugar de treinta pantallas. Una evidencia personal
        (`assessments.student_id`) devuelve un solo estudiante.

        No devuelve nota, a propósito: el sistema interno del colegio es la
        *otra* lectura de la misma evidencia y se captura en la pantalla del
        estudiante.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/ActorIdHeader"
        - name: assessmentID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: OK }
        "404": { description: not_found }

  /classes/{classID}/grading-components:
    get:
      tags: [04 Notas]
      summary: List grading components
      description: >
        The components of the class's effective scheme — the sections the
        evidence accordion groups by, and the options when filing evidencia.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/ActorIdHeader"
        - $ref: "#/components/parameters/ClassId"
        - $ref: "#/components/parameters/TermIdQuery"
      responses:
        "200": { description: OK }

  /classes/{classID}/assessments:
    post:
      tags: [04 Notas]
      summary: Create assessment (evidencia)
      description: >
        Files one piece of evidencia. Omit student_id for a column covering the
        whole class; set it to scope the evidence to that student alone (a
        recovery task, a re-done project). criterion_ids links the criterios de
        evaluación it evidences — evidence for the teacher's judgement, never
        rolled up into a nivel de logro, and the set of criterios the
        criteria-grid will let you value it against.

        counts_toward_internal (default true) is about the school's own weighted
        average only. False keeps the evidence in the official judgement and out
        of that number — the recovery task given to one student, which would
        otherwise lift only their average.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/ActorIdHeader"
        - $ref: "#/components/parameters/ClassId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
            example:
              title: "Quiz 2"
              kind: "quiz"
              component_code: "quiz"
              max_score: 20
              due_at: "2026-09-01T23:59:00Z"
              student_id: null
              counts_toward_internal: true
              criterion_ids: []
      responses:
        "201": { description: Created }
        "400": { description: student_not_in_class / criterion_not_in_class }

  /sessions/{sessionID}/start:
    post:
      tags: [02 Clase panel]
      summary: Start session
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/ActorIdHeader"
        - name: sessionID
          in: path
          required: true
          schema: { type: string, format: uuid }
          example: "7eb685eb-3c2f-4b29-a9cd-bae150bfd217"
          description: The 12-Aug session, still scheduled
      responses:
        "200": { description: OK }

  /sessions/{sessionID}:
    get:
      tags: [03 Leccion]
      summary: Session roster
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/ActorIdHeader"
        - $ref: "#/components/parameters/SessionId"
        - name: q
          in: query
          schema: { type: string }
          example: "agus"
      responses:
        "200": { description: OK }

  /sessions/{sessionID}/attendance/{studentID}:
    put:
      tags: [03 Leccion]
      summary: Upsert attendance
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/ActorIdHeader"
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/StudentId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
            example:
              status: "present"
              minutes_late: null
              note: null
      responses:
        "200": { description: OK }

  /sessions/{sessionID}/attendance/mark-all-present:
    post:
      tags: [03 Leccion]
      summary: Mark all present
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/ActorIdHeader"
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200": { description: OK }

  /sessions/{sessionID}/observations/{studentID}:
    put:
      tags: [03 Leccion]
      summary: Upsert observation
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/ActorIdHeader"
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/StudentId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
            example:
              note: "Buen trabajo en grupo"
              flag_type_ids: []
      responses:
        "200": { description: OK }

  /sessions/{sessionID}/students/{studentID}/voice-notes:
    post:
      tags: [03 Leccion]
      summary: Create voice note (multipart, audio required)
      description: |
        The real client sends multipart/form-data (an "audio" file field
        plus "duration_ms" and optional "mime_type" form fields) -- switch
        the body type to multipart/form-data in Bruno's editor to upload
        real audio. Audio is now stored in the database (bytea), written in
        the same transaction as the row, so it is required: at least 1000
        bytes and at most 2 MiB, and duration_ms may not exceed 60000 (voice
        notes are capped at 1 minute). The JSON body shown below has no
        audio bytes, so it always fails validation with 422 -- it's kept
        only to document the metadata fields multipart also carries.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/ActorIdHeader"
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/StudentId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
            example:
              duration_ms: 4200
              mime_type: "audio/webm"
      responses:
        "201": { description: Created }
        "422": { description: "Missing/too-short audio, or duration_ms over 60000" }

  /voice-notes/{voiceNoteID}/audio:
    get:
      tags: [03 Leccion]
      summary: Voice note audio
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/ActorIdHeader"
        - $ref: "#/components/parameters/VoiceNoteId"
      responses:
        "200": { description: OK }

  /voice-notes/{voiceNoteID}/save:
    post:
      tags: [03 Leccion]
      summary: Save voice note
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/ActorIdHeader"
        - name: voiceNoteID
          in: path
          required: true
          schema: { type: string, format: uuid }
          example: "5e67a914-feb9-4c37-a403-86a82cad09b1"
          description: Draft voice note
      responses:
        "200": { description: OK }

  /voice-notes/{voiceNoteID}/discard:
    post:
      tags: [03 Leccion]
      summary: Discard voice note
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/ActorIdHeader"
        - name: voiceNoteID
          in: path
          required: true
          schema: { type: string, format: uuid }
          example: "5e67a914-feb9-4c37-a403-86a82cad09b1"
          description: Draft voice note
      responses:
        "200": { description: OK }

  /assessments/{assessmentID}/delete:
    post:
      tags: [04 Notas]
      summary: Delete assessment (evidencia)
      description: >
        Soft-deletes a piece of evidence created by mistake. Scores already
        recorded against it stay in the student's history, but the assessment
        stops counting towards the school's internal weighted grade, so every
        affected student is requeued for recompute.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/ActorIdHeader"
        - $ref: "#/components/parameters/AssessmentId"
      responses:
        "204": { description: Deleted }
        "404": { description: assessment_not_found }

  /assessments/{assessmentID}/scores:
    post:
      tags: [04 Notas]
      summary: Create score
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/ActorIdHeader"
        - $ref: "#/components/parameters/AssessmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
            example:
              student_id: "fba03b7e-865f-470a-9a36-70077a3fadf9"
              status: "graded"
              raw_value: 15
              late_days: 0
      responses:
        "201": { description: Created }

  /scores/{scoreID}/correct:
    post:
      tags: [04 Notas]
      summary: Correct score
      description: |
        Supersedes the live row named by scoreID. A second call against the
        same id 409s -- fetch "Student grades" and swap in the new live
        score id to correct again.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/ActorIdHeader"
        - $ref: "#/components/parameters/ScoreId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
            example:
              raw_value: 14
      responses:
        "201": { description: Created }

  /notifications:
    get:
      tags: [07 Notificaciones]
      summary: List notifications
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
