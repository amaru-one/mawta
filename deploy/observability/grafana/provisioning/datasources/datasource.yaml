# Loki datasource for the local Mawta observability stack.
#
# Provisioned from a versioned file so no manual setup is needed: Grafana
# loads it at startup from /etc/grafana/provisioning/datasources.
apiVersion: 1

datasources:
  - name: Loki
    uid: mawta-loki
    type: loki
    access: proxy
    # The compose service name resolves inside the compose network; Grafana
    # never needs a published Loki port.
    url: http://loki:3100
    isDefault: true
    editable: false
    jsonData:
      # Loki has no multi-tenancy here (auth_enabled: false), so no
      # X-Scope-OrgID header is needed.
      maxDataPoints: 1000
      timeout: 60
      # Keep derived fields minimal: the log line already carries
      # request_id/task_id/generation_id as JSON fields; the dashboard
      # queries them with json filters instead of adding derived links.
      derivedFields:
        []
