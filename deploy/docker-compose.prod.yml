# Production stack: Postgres (pgvector), the Go API, and Caddy serving the
# built SPA + reverse-proxying /api and /healthz to the API — same origin,
# so the browser never needs CORS. Run from /srv/mawta (see ../DEPLOY.md).
#
# Usage:
#   docker compose --env-file /srv/mawta/.env -f docker-compose.prod.yml up -d

# Fixed project name so containers and volumes are mawta-* regardless of
# which directory compose is invoked from.
name: mawta

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: mawta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d mawta']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ${API_IMAGE:-mawta-api:local}
    build:
      context: ../mawta-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The api process itself connects as the non-owner mawta_app role —
      # enough for every request, scoped by RLS. ADMIN_DATABASE_URL connects
      # as the postgres superuser: unused by the running api process, but
      # needed when this same image runs as `--entrypoint useradd` (it seeds
      # the first users/memberships row in an empty tenant, which mawta_app
      # cannot do) — same reason GOOSE_DBSTRING is defined here too, below.
      DATABASE_URL: postgres://mawta_app:${MAWTA_APP_PASSWORD:?set MAWTA_APP_PASSWORD in .env}@postgres:5432/mawta?sslmode=disable
      ADMIN_DATABASE_URL: &admin_db_url postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/mawta?sslmode=disable
      HTTP_ADDR: ':8080'
      WORKER_ENABLED: 'true'
      WORKER_CONCURRENCY: '2'
      STORAGE_DIR: /data/audio
      CORS_ORIGINS: https://${DOMAIN}
      LOG_LEVEL: info
      SESSION_COOKIE_SECURE: 'true'
      # Voice-note transcription (OpenRouter Whisper). Left optional so a
      # missing key doesn't block deploys; transcribe jobs fail until it's set.
      TRANSCRIBE_OPENROUTER_API_KEY: ${TRANSCRIBE_OPENROUTER_API_KEY:-}
      # Mawta's agents ("✦ Generar con Mawta", Claude via the Anthropic API).
      # Optional: without it the generation routes answer agent_unavailable
      # and teachers plan by hand.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PLANNING_AGENT_MODEL: ${PLANNING_AGENT_MODEL:-claude-sonnet-5-5}
      # Lets `docker compose run --rm --entrypoint goose api up` migrate with
      # zero CLI args — no shell needed to expand a $DATABASE_URL argument
      # over SSH, and the distroless image has no shell to do it anyway.
      # Migrations need real ownership, so this reuses the admin connection.
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: *admin_db_url
      GOOSE_MIGRATION_DIR: /app/migrations
    volumes:
      - /srv/mawta/audio:/data/audio

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/mawta/ui:/srv/ui:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
