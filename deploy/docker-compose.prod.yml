# Production stack: Postgres (pgvector), the Go API, the director chat
# service, and Caddy serving the built SPA + reverse-proxying /api and
# /healthz to the API and /chat-api to the chat — same origin, so the
# browser never needs CORS. Run from /srv/mawta (see ../DEPLOY.md).
#
# Usage:
#   docker compose --env-file /srv/mawta/.env -f docker-compose.prod.yml up -d

# Fixed project name so containers and volumes are mawta-* regardless of
# which directory compose is invoked from.
name: mawta

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: mawta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d mawta']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ${API_IMAGE:-mawta-api:local}
    build:
      context: ../mawta-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The api process itself connects as the non-owner mawta_app role —
      # enough for every request, scoped by RLS. ADMIN_DATABASE_URL connects
      # as the postgres superuser: unused by the running api process, but
      # needed when this same image runs as `--entrypoint useradd` (it seeds
      # the first users/memberships row in an empty tenant, which mawta_app
      # cannot do) — same reason GOOSE_DBSTRING is defined here too, below.
      DATABASE_URL: postgres://mawta_app:${MAWTA_APP_PASSWORD:?set MAWTA_APP_PASSWORD in .env}@postgres:5432/mawta?sslmode=disable
      ADMIN_DATABASE_URL: &admin_db_url postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/mawta?sslmode=disable
      HTTP_ADDR: ':8080'
      WORKER_ENABLED: 'true'
      WORKER_CONCURRENCY: '2'
      STORAGE_DIR: /data/audio
      CORS_ORIGINS: https://${DOMAIN}
      LOG_LEVEL: info
      SESSION_COOKIE_SECURE: 'true'
      # Voice-note transcription (OpenRouter Whisper). Left optional so a
      # missing key doesn't block deploys; transcribe jobs fail until it's set.
      TRANSCRIBE_OPENROUTER_API_KEY: ${TRANSCRIBE_OPENROUTER_API_KEY:-}
      # Mawta's agents ("✦ Generar con Mawta", Claude via the Anthropic API).
      # Optional: without it the generation routes answer agent_unavailable
      # and teachers plan by hand.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PLANNING_AGENT_MODEL: ${PLANNING_AGENT_MODEL:-claude-sonnet-5-5}
      # The director's token for the chat service (GET /api/v1/auth/chat-token).
      # Generate with `go run ./cmd/chatkey -kid k1`. Optional: without it the
      # route answers chat_unavailable; a set but invalid key stops the API
      # from starting.
      CHAT_TOKEN_SIGNING_KEY: ${CHAT_TOKEN_SIGNING_KEY:-}
      CHAT_TOKEN_KEY_ID: ${CHAT_TOKEN_KEY_ID:-}
      # Lets `docker compose run --rm --entrypoint goose api up` migrate with
      # zero CLI args — no shell needed to expand a $DATABASE_URL argument
      # over SSH, and the distroless image has no shell to do it anyway.
      # Migrations need real ownership, so this reuses the admin connection.
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: *admin_db_url
      GOOSE_MIGRATION_DIR: /app/migrations
    volumes:
      - /srv/mawta/audio:/data/audio

  # The director chat service (mawta-chat). Reached only through Caddy at
  # /chat-api/*. Its variables are required: a deploy without them fails
  # loudly instead of shipping a chat that cannot start.
  chat:
    image: ${CHAT_IMAGE:-mawta-chat:local}
    build:
      context: ../mawta-chat
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The mawta database as mawta_chat: reads chat_api, writes chat (00006).
      CHAT_DATABASE_URL: postgres://mawta_chat:${MAWTA_CHAT_PASSWORD:?set MAWTA_CHAT_PASSWORD in .env}@postgres:5432/mawta?sslmode=disable
      # LangGraph's own database, owned by mawta_langgraph (created by hand,
      # see mawta-chat/README.md); LangGraph creates its tables on startup.
      LANGGRAPH_DATABASE_URL: postgres://mawta_langgraph:${LANGGRAPH_PASSWORD:?set LANGGRAPH_PASSWORD in .env}@postgres:5432/langgraph?sslmode=disable
      # {"kid": "<base64 public key>"} matching CHAT_TOKEN_SIGNING_KEY above.
      CHAT_TOKEN_PUBLIC_KEYS: ${CHAT_TOKEN_PUBLIC_KEYS:?set CHAT_TOKEN_PUBLIC_KEYS in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env}
      CHAT_MODEL: ${CHAT_MODEL:-claude-sonnet-5-5}
    # A small droplet (2 GB, 1 CPU): the chat must not starve Postgres or the API.
    mem_limit: 512m
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - chat
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      # The directory, not the file: the deploy replaces the Caddyfile with a
      # new file, and a file bind mount keeps showing the container the old
      # one, so `caddy reload` re-read stale config (2026-10-18). A directory
      # mount sees the new file.
      - ./caddy:/etc/caddy:ro
      - /srv/mawta/ui:/srv/ui:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
