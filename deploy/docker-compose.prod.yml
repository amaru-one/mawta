# Production stack: Postgres (pgvector), the Go API, and Caddy serving the
# built SPA + reverse-proxying /api and /healthz to the API — same origin,
# so the browser never needs CORS. Run from /srv/yanai (see ../DEPLOY.md).
#
# Usage:
#   docker compose --env-file /srv/yanai/.env -f docker-compose.prod.yml up -d

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: yanai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d yanai']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ${API_IMAGE:-yanai-api:local}
    build:
      context: ../yanai-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: &db_url postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/yanai?sslmode=disable
      HTTP_ADDR: ':8080'
      WORKER_ENABLED: 'true'
      WORKER_CONCURRENCY: '2'
      STORAGE_DIR: /data/audio
      CORS_ORIGINS: https://${DOMAIN}
      LOG_LEVEL: info
      SESSION_COOKIE_SECURE: 'true'
      # Lets `docker compose run --rm --entrypoint goose api up` migrate with
      # zero CLI args — no shell needed to expand a $DATABASE_URL argument
      # over SSH, and the distroless image has no shell to do it anyway.
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: *db_url
      GOOSE_MIGRATION_DIR: /app/migrations
    volumes:
      - /srv/yanai/audio:/data/audio

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/yanai/ui:/srv/ui:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
