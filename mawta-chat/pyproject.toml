[project]
name = "mawta-chat"
version = "0.1.0"
description = "Director chat service for Mawta"
readme = "README.md"
authors = [
    { name = "amaru", email = "amaruorihuela@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.3",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-postgres>=3.2.0",
    "openai>=3.40.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "pyjwt[crypto]>=2.15.1",
    "sse-starlette>=3.5.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
mawta-chat = "main:run"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The modules live directly under src/ (no package wrapper): ship everything there at the wheel root.
only-include = ["src"]
sources = ["src"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
# Top-level modules live under src/, so it is first-party code for the import sorter.
src = [".", "src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "UP"]
ignore = ["E501"]  # long SQL and prompt lines; the formatter handles code

[tool.ruff.lint.isort]
known-first-party = ["conftest"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
