# On main: the CI, then the image to GitHub's registry (ghcr.io/amaru-one/mawta:<sha>), then
# mawta-ops is told the new version so it deploys it (mawta-ops/.github/workflows/deploy.yml).
#
# The push uses the automatic GITHUB_TOKEN. Needs: secret OPS_DISPATCH_TOKEN (a fine-grained token
# allowed to send repository_dispatch to mawta-ops).
# This repository is public, and so is its image: the code is public and the image holds no
# secrets (they come from the droplet's .env at runtime). Pull requests from forks run ci.yml only.
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/mawta:${{ github.sha }}
          # Links the package to this repository (its page, and its visibility and access).
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  tell-ops:
    needs: image
    runs-on: ubuntu-24.04
    steps:
      - uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.OPS_DISPATCH_TOKEN }}
          repository: amaru-one/mawta-ops
          event-type: release
          client-payload: '{"component": "app", "version": "${{ github.sha }}"}'
