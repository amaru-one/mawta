name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-api-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: yanai-server
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/yanai-api:latest
            ghcr.io/${{ github.repository_owner }}/yanai-api:${{ github.sha }}

  build-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        working-directory: yanai-ui
        run: bun install --frozen-lockfile
      - name: Build SPA
        working-directory: yanai-ui
        env:
          PUBLIC_API_BASE_URL: ''
          PUBLIC_TENANT_ID: ${{ secrets.PUBLIC_TENANT_ID }}
          PUBLIC_ACTOR_ID: ${{ secrets.PUBLIC_ACTOR_ID }}
        run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: ui-build
          path: yanai-ui/build

  deploy:
    needs: [build-api-image, build-ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ui-build
          path: ui-build
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}
      - name: Trust the deploy host
        run: ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
      - name: Ship the built SPA
        env:
          SSH_TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: rsync -az --delete ui-build/ "$SSH_TARGET:/srv/yanai/ui/"
      - name: Ship compose config
        env:
          SSH_TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: rsync -az deploy/ "$SSH_TARGET:/srv/yanai/deploy/"

      - name: Pull the new API image, migrate, restart
        env:
          SSH_TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          API_IMAGE: ghcr.io/${{ github.repository_owner }}/yanai-api:${{ github.sha }}
        run: |
          ssh "$SSH_TARGET" "cd /srv/yanai && export API_IMAGE=$API_IMAGE && \
            docker compose --env-file .env -f deploy/docker-compose.prod.yml pull api caddy postgres && \
            docker compose --env-file .env -f deploy/docker-compose.prod.yml run --rm --entrypoint /usr/local/bin/goose api up && \
            docker compose --env-file .env -f deploy/docker-compose.prod.yml up -d"

      - name: Smoke test
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
          PUBLIC_TENANT_ID: ${{ secrets.PUBLIC_TENANT_ID }}
          PUBLIC_ACTOR_ID: ${{ secrets.PUBLIC_ACTOR_ID }}
        run: |
          curl -fsS "https://$DOMAIN/healthz"
          curl -fsS "https://$DOMAIN/api/v1/me" \
            -H "X-Tenant-ID: $PUBLIC_TENANT_ID" \
            -H "X-Actor-ID: $PUBLIC_ACTOR_ID"
