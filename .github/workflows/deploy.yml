name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-api-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: mawta-server
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mawta-api:latest
            ghcr.io/${{ github.repository_owner }}/mawta-api:${{ github.sha }}

  build-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        working-directory: mawta-ui
        run: bun install --frozen-lockfile
      - name: Build SPA
        working-directory: mawta-ui
        env:
          PUBLIC_API_BASE_URL: ''
          # Shows the term-planning flow ("Plan del trimestre"). Read at build
          # time, so changing it takes a UI redeploy. "✦ Generar con Mawta"
          # additionally needs ANTHROPIC_API_KEY in the server's .env.
          PUBLIC_PLANNING_ENABLED: 'true'
        run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: ui-build
          path: mawta-ui/build

  deploy:
    needs: [build-api-image, build-ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ui-build
          path: ui-build
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}
      - name: Trust the deploy host
        run: ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
      - name: Ship the built SPA
        env:
          SSH_TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: rsync -az --delete ui-build/ "$SSH_TARGET:/srv/mawta/ui/"
      - name: Ship compose config
        env:
          SSH_TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: rsync -az deploy/ "$SSH_TARGET:/srv/mawta/deploy/"

      - name: Pull the new API image, migrate, restart
        env:
          SSH_TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          API_IMAGE: ghcr.io/${{ github.repository_owner }}/mawta-api:${{ github.sha }}
        run: |
          ssh "$SSH_TARGET" "cd /srv/mawta && export API_IMAGE=$API_IMAGE && \
            docker compose --env-file .env -f deploy/docker-compose.prod.yml pull api caddy postgres && \
            docker compose --env-file .env -f deploy/docker-compose.prod.yml run --rm --entrypoint /usr/local/bin/goose api up && \
            docker compose --env-file .env -f deploy/docker-compose.prod.yml up -d"

      - name: Smoke test
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          curl -fsS "https://$DOMAIN/healthz"
          # No credential in CI: real auth means there's nothing to log in
          # as here, so the smoke test just confirms the route requires a
          # session rather than trusting a header.
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://$DOMAIN/api/v1/me")
          if [ "$status" != "401" ]; then
            echo "expected 401 (no session) from /api/v1/me, got $status" >&2
            exit 1
          fi
