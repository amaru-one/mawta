name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mawta-api
    # The tests create their own throwaway database inside this service and
    # drop it again; they never touch the `postgres` database itself. Setting
    # MAWTA_TEST_ADMIN_URL here is what makes a false baseline unmergeable:
    # without it the database tests skip, and a run that verified nothing looks
    # exactly like a run that passed.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.1'
      # The transcoding path shells out to ffmpeg.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
        env:
          MAWTA_TEST_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mawta-ui
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun eslint .
      - run: bunx playwright install --with-deps chromium webkit
      - run: bun run test:components
      - run: bun run build

  chat:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mawta-chat
    # Same contract as the server job: the chat tests migrate their own
    # throwaway databases from mawta-api/migrations and skip without
    # MAWTA_TEST_ADMIN_URL, so setting it is what makes them count.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.1'
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
        env:
          MAWTA_TEST_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
