name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mawta-server
    # The tests create their own throwaway database inside this service and
    # drop it again; they never touch the `postgres` database itself. Setting
    # MAWTA_TEST_ADMIN_URL here is what makes a false baseline unmergeable:
    # without it the database tests skip, and a run that verified nothing looks
    # exactly like a run that passed.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: mawta-server/go.sum
      # internal/media shells out to ffmpeg on the voice-note request path.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: go vet ./...
      - run: go build ./...
      # -shuffle=on because the suite shares one database per package: it has
      # already caught one order-dependent assertion, and it is the only thing
      # that would catch the next.
      - run: go test ./... -count=1 -race -shuffle=on
        env:
          MAWTA_TEST_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mawta-ui
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun eslint .
      - run: bunx playwright install --with-deps chromium webkit
      - run: bun run test:components
      - run: bun run test:ui
      - run: bun run build
