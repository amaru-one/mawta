name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mawta-api
    # The tests create their own throwaway database inside this service and
    # drop it again; they never touch the `postgres` database itself. Setting
    # MAWTA_TEST_ADMIN_URL here is what makes a false baseline unmergeable:
    # without it the database tests skip, and a run that verified nothing looks
    # exactly like a run that passed.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
      # The transcoding path shells out to ffmpeg (tests/test_media.py runs it). A static
      # build is one download with no system libraries; apt took 4-5 minutes on a slow mirror.
      # The site only publishes the current release, so the tarball is checked against the
      # md5 it publishes next to it, and test_media.py fails if a build ever drops MP3, Opus
      # or AAC.
      - name: Install a static ffmpeg
        working-directory: ${{ runner.temp }}
        run: |
          base=https://johnvansickle.com/ffmpeg/releases
          curl -fsSL --retry 5 --retry-delay 5 -O "$base/ffmpeg-release-amd64-static.tar.xz"
          curl -fsSL --retry 5 --retry-delay 5 -O "$base/ffmpeg-release-amd64-static.tar.xz.md5"
          md5sum -c ffmpeg-release-amd64-static.tar.xz.md5
          tar -xJf ffmpeg-release-amd64-static.tar.xz --strip-components=1 --wildcards '*/ffmpeg'
          sudo install -m 0755 ffmpeg /usr/local/bin/ffmpeg
          ffmpeg -version | head -1
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
        env:
          MAWTA_TEST_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable

  ui:
    runs-on: ubuntu-latest
    # The component tests run in real Chromium and WebKit. This image ships both
    # plus their system libraries, so the job no longer downloads them through
    # apt (a slow mirror once stretched that step to 20 minutes). Keep the tag
    # equal to the `playwright` version locked in mawta-ui/bun.lock.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    defaults:
      run:
        working-directory: mawta-ui
    steps:
      - uses: actions/checkout@v4
      # setup-bun unzips its download and the Playwright image has no `unzip`;
      # the npm package ships the same binary and the image already has Node.
      - run: npm install --global bun
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun eslint .
      - run: bun run test:components
      - run: bun run build

  chat:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mawta-chat
    # Same contract as the server job: the chat tests migrate their own
    # throwaway databases from mawta-api/migrations and skip without
    # MAWTA_TEST_ADMIN_URL, so setting it is what makes them count.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
        env:
          MAWTA_TEST_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
